<form class="form" id="new-ticket" (ngSubmit)="onSubmit()" >
  <p>
    <label>Title</label>
    <input name="title" id="title" [(ngModel)]="title" />
  </p>
  <p>
    <label>Request</label>
    <textarea name="request" id="request" rows="3" [(ngModel)]="request"></textarea>
  </p>
  <p>
    <app-button buttonName="Submit" />
  </p>
</form>
