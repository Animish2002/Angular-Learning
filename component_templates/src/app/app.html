<app-header />

<main>
  <div id="dashboard">
    <app-dashboard-item
      [image]="{ src: 'status.png', alt: 'A server status' }"
      title="A Server status"
    >
      <app-server-status />
    </app-dashboard-item>

    <app-dashboard-item [image]="{ src: 'globe.png', alt: 'A Globe symbol' }" title="Traffic">
      <app-traffic />
    </app-dashboard-item>

    <app-dashboard-item form [image]="{ src: 'list.png', alt: 'Support Ticket' }" title="Support Ticket">
      <app-support-ticket />
    </app-dashboard-item>
  </div>
</main>
