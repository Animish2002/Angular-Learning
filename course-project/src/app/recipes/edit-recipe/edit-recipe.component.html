<div class="container mt-4">
  <div class="card shadow-sm">
    <div class="card-header d-flex justify-content-between align-items-center">
      <h4 class="mb-0">
        {{ isEditMode ? "Edit Recipe" : "Add Recipe" }}
      </h4>

      <div class="d-flex gap-2">
        <button type="submit" class="btn btn-success" form="recipeForm">
          Save
        </button>
        <a routerLink="/recipes" class="btn btn-danger">Cancel</a>
      </div>
    </div>

    <div class="card-body">
      <form
        id="recipeForm"
        [formGroup]="recipeFormData"
        (ngSubmit)="onSubmit()"
      >
        <!-- BASIC FIELDS -->
        <div class="mb-3">
          <label class="form-label">Recipe Name</label>
          <input class="form-control" formControlName="name" />
        </div>

        <div class="mb-3">
          <label class="form-label">Image URL</label>
          <input class="form-control" formControlName="imagePath" />
        </div>

        <div class="mb-3">
          <label class="form-label">Description</label>
          <textarea
            class="form-control"
            formControlName="description"
          ></textarea>
        </div>

        <!-- INGREDIENTS -->
        <div
          class="d-flex justify-content-between align-items-center mb-2 mt-4"
        >
          <h5 class="mb-0">Ingredients</h5>

          <button
            type="button"
            class="btn btn-primary btn-sm"
            (click)="addIngredient()"
          >
            + Add Ingredient
          </button>
        </div>

        <div formArrayName="ingredients">
          <div
            *ngFor="let ing of ingredients.controls; let i = index"
            [formGroupName]="i"
            class="row mb-2 align-items-center"
          >
            <div class="col-md-5">
              <input
                class="form-control"
                placeholder="Ingredient name"
                formControlName="name"
              />
            </div>

            <div class="col-md-4">
              <input
                class="form-control"
                type="number"
                placeholder="Amount"
                formControlName="amount"
              />
            </div>

            <div class="col-md-3">
              <button
                type="button"
                class="btn btn-outline-danger w-100"
                (click)="removeIngredient(i)"
              >
                Remove
              </button>
            </div>
          </div>
        </div>

        <hr />

        <div class="text-center">
          <button type="submit" class="btn btn-success px-4">
            {{ isEditMode ? "Update" : "Add Recipe" }}
          </button>
        </div>
      </form>
    </div>
  </div>
</div>
