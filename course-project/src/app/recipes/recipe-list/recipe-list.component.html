<div class="row mb-3">
  <div class="col-xs-12 text-end">
    <button (click)="onClick()" class="btn btn-success shadow-sm d-flex">New Recipe</button>
  </div>
</div>
<hr>

<div class="row">
  <div class="col-xs-12">
    <div class="list-group recipe-list ">
      <div
        class="d-flex align-items-center border p-3 border rounded justify-content-between mb-2 cursor-pointer"
        [routerLink]="['/recipes', recipe.id]"
        routerLinkActive="active"
        *ngFor="let recipe of recipes"
        (click)="onSelectRecipe(recipe)"
      >
        <div>
          <h4 class="list-group-item-heading mb-1">{{ recipe.name }}</h4>
          <p class="list-group-item-text text-muted mb-2">
            {{ recipe.description }}
          </p>
        </div>
        <img
          [src]="recipe.imagePath"
          alt="recipe-image"
          class="img-fluid rounded"
          style="width: 30%"
        />
      </div>
    </div>
  </div>
</div>
