<div *ngIf="recipe; else noSelection">
  <h2>{{ recipe.name }}</h2>
  <p>{{ recipe.description }}</p>
  <img
    [src]="recipe.imagePath"
    alt="{{ recipe.name }}"
    class="img-fluid rounded"
    style="max-width: 300px"
  />
</div>

<ng-template #noSelection>
  <p>Please select a recipe to view details.</p>
</ng-template>
