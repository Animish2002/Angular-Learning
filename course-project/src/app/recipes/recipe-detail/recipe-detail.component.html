<div *ngIf="recipe; else noSelection">
  <h2>{{ recipe.name }}</h2>
  <p>{{ recipe.description }}</p>
  <img
    [src]="recipe.imagePath"
    alt="{{ recipe.name }}"
    class="img-fluid rounded"
    style="max-width: 500px"
  />
  <div class="dropdown open mt-2 d-block">
    <button
      class="btn btn-primary dropdown-toggle"
      type="button"
      id="triggerId"
      data-bs-toggle="dropdown"
      aria-haspopup="true"
      aria-expanded="false"
    >
      Manage Recipe
    </button>
    <ul class="dropdown-menu" aria-labelledby="triggerId">
      <li class="dropdown-item"><a href="">To ShoppinG lIST</a></li>
      <li class="dropdown-item"><a href="">Action</a></li>
      <li class="dropdown-item"><a href=""> Disabled action</a></li>
    </ul>
  </div>

  <div class="row mt-4">
    <div class="col-xs-12">
      <ul class="list-group">
        <li
          class="list-group-item"
          *ngFor="let ingredient of recipe.ingredients"
        >
          {{ ingredient.name }} ({{ ingredient.amount }})
        </li>
      </ul>
    </div>
  </div>
</div>

<ng-template #noSelection>
  <p>Please select a recipe to view!.</p>
</ng-template>
