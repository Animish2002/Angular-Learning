<div class="row">
  <div class="col-md-10">
    <app-shopping-edit (addIngredient)="onAddIngredient($event)"></app-shopping-edit>
    <hr />

    <ul class="list-group">
      <a
        href="#"
        class="list-group-item"
        style="cursor: pointer"
        *ngFor="let ingredient of ingredients; let i = index"
      [ngClass]="{ 'text-danger': i >= 2 }"
      >
        {{ ingredient.name }} ({{ ingredient.amount }})
      </a>
    </ul>
  </div>
</div>
