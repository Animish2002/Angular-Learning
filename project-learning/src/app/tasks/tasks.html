<section id="tasks">
  <header>
    <h2>{{ name }}'s Tasks</h2>
  </header>

  <ul>
    @for (task of selectedUserTasks; track task.id) {
      <li>
        <app-task
          [title]="task.title"
          [summary]="task.summary"
          [dueDate]="task.dueDate"
        />
      </li> 
    }
  </ul>
</section>
