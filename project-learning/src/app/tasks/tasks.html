<section id="tasks">
  <header>
    <h2>{{ name }}'s Tasks</h2>
    <menu>
      <button (click)="isAddingTask = true">Add Task</button>
    </menu>
  </header>

  <ul>
    <li *ngFor="let task of selectedUserTasks; trackBy: trackTask">
      <app-task [tasks]="task" (complete)="onCompleteTask($event)" />
    </li>
  </ul>

  <app-new-task
    *ngIf="isAddingTask"
    (cancel)="onCancelTask()"
    (add)="onAddTask($event)"
  />
</section>
