<app-header/>

<main>
  <ul id="users">
    <li *ngFor="let user of users">
      <app-user
        [id]="user.id"
        [avatar]="user.avatar"
        [name]="user.name"
        (select)="onUserSelected($event)"
        [selected]="user.id === selectedUserId"
      ></app-user>
    </li>
  </ul>

  <div *ngIf="selectedUserId">
    <app-tasks [id]="selectedUserId" [name]="selectedUserName"></app-tasks>
  </div>
</main>
