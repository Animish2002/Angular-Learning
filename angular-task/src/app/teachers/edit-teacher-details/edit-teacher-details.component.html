<form #f="ngForm" class="form" (ngSubmit)="onEditSubmit(f)">
  <h1>Edit Teacher</h1>
  <div>
    <mat-form-field>
      <mat-label>First Name</mat-label>
      <input
        matInput
        name="firstname"
        required
        ngModel
        [ngModel]="teacherData?.firstname"
      />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Last Name</mat-label>
      <input
        matInput
        name="lastname"
        required
        ngModel
        [ngModel]="teacherData?.lastname"
      />
    </mat-form-field>
  </div>
  <div>
    <mat-form-field>
      <mat-label>Age</mat-label>
      <input
        matInput
        name="age"
        required
        ngModel
        [ngModel]="teacherData?.age"
      />
    </mat-form-field>
    <mat-form-field>
      <mat-label>Subjects</mat-label>
      <input
        matInput
        name="subject"
        required
        ngModel
        [ngModel]="teacherData?.subject"
      />
    </mat-form-field>
  </div>

  <div class="example-button-row">
    <button mat-flat-button color="primary">Submit</button>
  </div>
</form>
